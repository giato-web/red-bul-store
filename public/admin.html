<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة RED BUL</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-body"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">R</span><span>RED <b>BUL</b><small>لوحة الإدارة</small></span></a><a href="/">عرض المتجر ↗</a></header>
<main class="admin-main">
<section id="loginBox" class="login-card"><span class="eyebrow">منطقة محمية</span><h1>تسجيل دخول المدير</h1><p>سجّل الدخول لإدارة المنتجات والطلبات والرخص.</p><form id="loginForm"><label>اسم المستخدم<input id="username" autocomplete="username" required value="admin"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary full">دخول لوحة الإدارة</button><div id="loginError" class="notice hidden"></div></form></section>
<section id="dashboard" class="hidden"><div class="admin-title"><div><span class="eyebrow">إدارة المتجر</span><h1>لوحة التحكم</h1></div><button id="logout" class="btn ghost">تسجيل الخروج</button></div>
<div class="admin-tabs"><button class="tab active" data-tab="productsTab">المنتجات</button><button class="tab" data-tab="ordersTab">الطلبات</button><button class="tab" data-tab="licensesTab">الرخص والأكواد</button></div>
<section id="productsTab" class="tab-content"><div class="admin-panel"><h2 id="productFormTitle">إضافة منتج</h2><form id="productForm" class="admin-form"><input type="hidden" id="productId"><label>اسم المنتج<input id="pName" required maxlength="150"></label><label>السعر (USD)<input id="pPrice" type="number" min="0" step=".01" required></label><label>التصنيف<input id="pCategory" value="رقمي"></label><label class="wide">الوصف<textarea id="pDescription" rows="3"></textarea></label><label class="wide">صورة المنتج (اختياري)<input id="pImageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>PNG/JPG/WEBP/GIF، الحد الأقصى 5MB.</small></label><label class="wide">أو رابط صورة<input id="pImageUrl" placeholder="https://..."></label><label class="check-label"><input id="pActive" type="checkbox" checked> المنتج ظاهر في المتجر</label><div class="wide form-actions"><button class="btn primary">حفظ المنتج</button><button type="button" id="resetProduct" class="btn ghost">إلغاء / تفريغ</button></div><div id="productMessage" class="notice hidden wide"></div></form></div><div class="admin-panel"><h2>قائمة المنتجات</h2><div id="adminProducts" class="admin-list"></div></div></section>
<section id="ordersTab" class="tab-content hidden"><div class="admin-panel"><h2>الطلبات</h2><div id="adminOrders" class="admin-list"></div></div></section>
<section id="licensesTab" class="tab-content hidden"><div class="admin-panel"><h2>إنشاء رخصة أو أكواد تفعيل</h2><form id="licenseForm" class="admin-form"><label>المنتج<select id="lProduct"><option value="">رخصة عامة</option></select></label><label>مدة الرخصة بالأيام<input id="lDays" type="number" min="1" max="3650" value="30"></label><label>عدد مرات الاستخدام<input id="lUses" type="number" min="1" max="10000" value="1"></label><label>عدد الأكواد<input id="lCount" type="number" min="1" max="100" value="1"></label><div class="wide"><button class="btn primary">توليد الأكواد</button></div><div id="licenseMessage" class="notice hidden wide"></div></form></div><div class="admin-panel"><h2>الأكواد المنشأة</h2><div id="adminLicenses" class="admin-list"></div></div></section>
</section></main><script src="/admin.js"></script></body></html>
