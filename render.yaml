services:
  - type: web
    name: red-bul-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CURRENCY
        value: USD
      - key: STORE_NAME
        value: RED BUL
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: red-bul-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: BASE_URL
        sync: false
databases:
  - name: red-bul-db
    plan: free
